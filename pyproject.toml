[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ghstats"
version = "0.1.0"
description = "Report GitHub organization activity from an incremental local store"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Oliver Wehrens" }]
keywords = ["github", "graphql", "reporting", "metrics", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/owehrens/ghstats"
Repository = "https://github.com/owehrens/ghstats"
Issues = "https://github.com/owehrens/ghstats/issues"

[project.scripts]
# Only ghstats-sync touches the network; everything else reads the store.
ghstats-sync = "ghstats.sync:main"
ghstats-reindex = "ghstats.reindex:main"
ghstats-explore = "ghstats.explorer.server:main"
ghstats-inactive = "ghstats.tools.inactive_users:main"
ghstats-import-cache = "ghstats.tools.import_cache:main"
ghstats-verify-overlap = "ghstats.tools.verify_overlap:main"

[tool.setuptools.packages.find]
where = ["src"]

# The explorer serves its own HTML, CSS and JS from the installed package.
# `static/*` does not recurse, so the vendored chart library needs its own line.
[tool.setuptools.package-data]
"ghstats.explorer" = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
